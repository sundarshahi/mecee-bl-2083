<title>MECEE-BL 2083</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: a calm phone app for long study sessions. Grey-green paper (no pure white), charcoal ink (no pure black),
   one muted teal accent, soft gold only for rewards. One 480px column; a floating tab bar; bottom sheets for feedback.
   Calm by day, Calm night from 18:00 to 06:00 (or chosen in Settings). Gentle motion only. */
:root{
  --bg:#E8ECE7; --card:#F4F6F2; --ink:#29312E; --muted:#636E69; --line:#D7DDD6; --soft:#E2E7E0;
  --acc:#3D766F; --acc-2:#DAE8E4; --on-acc:#F4F6F2; --flame:#C27A55;
  --gold:#BF9248; --gold-2:#EFE6D3; --gold-ink:#6E521C;
  --ok:#4C8960; --ok-2:#DFEBE0; --ok-ink:#2E6640; --bad:#B4675C; --bad-2:#F1E2DE; --bad-ink:#8A4238;
  --bar:rgba(244,246,242,.97); --shadow:0 1px 2px rgb(41 49 46/.05),0 4px 14px rgb(41 49 46/.05); --scrim:rgb(30 36 34/.35);
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-look="night"]{
  color-scheme:dark;
  --bg:#1A1E1D; --card:#222826; --ink:#D3D9D5; --muted:#97A19C; --line:#313836; --soft:#29302D;
  --acc:#85B3AA; --acc-2:#2A3936; --on-acc:#1A1E1D; --flame:#D49674;
  --gold:#CDAC6C; --gold-2:#36301F; --gold-ink:#D9BE88;
  --ok:#85B992; --ok-2:#233229; --ok-ink:#A4CDAD; --bad:#D29286; --bad-2:#382824; --bad-ink:#E1ADA3;
  --bar:rgba(34,40,38,.97); --shadow:0 1px 2px rgb(0 0 0/.25); --scrim:rgb(0 0 0/.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 17px/1.6 var(--f);padding-inline:16px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));transition:background .4s,color .4s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--acc)}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;line-height:1.2;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px} h2{font-size:21px} h3{font-size:18px}
p{margin:0}
.tn{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14.5px;line-height:1.5}
.lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:grid;gap:12px}
#app{max-width:480px;margin:0 auto}
main{display:flex;flex-direction:column;gap:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
main.enter{animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}

.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:16.5px;transition:transform .15s var(--ease),opacity .2s;text-align:center;text-decoration:none;padding:0 14px}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.ok{background:var(--ok);color:var(--on-acc)} .btn.bad{background:var(--bad);color:var(--on-acc)}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-height:46px;width:100%}
textarea{min-height:170px;font-size:14px;line-height:1.5}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
.kbd{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6}

/* hud */
.hud{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:15px;white-space:nowrap}
.pill svg{width:18px;height:18px}
.grow{flex:1}
.brand{font-weight:800;font-size:15px}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}

/* home */
.hero{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--soft)} .ring .val{stroke:var(--acc);transition:stroke-dashoffset 1s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:23px;line-height:1}
.ring b small{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px}
.cta{min-height:66px;border-radius:20px;justify-content:space-between;padding:0 18px;text-align:left;font-size:17px}
.cta small{display:block;font-size:12px;font-weight:600;opacity:.85}
.cta .go{width:36px;height:36px;border-radius:50%;background:rgb(255 255 255/.18);display:grid;place-items:center;flex:none}
.score{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.02em}
.track{position:relative;height:10px;border-radius:999px;background:var(--soft);margin-top:12px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--acc);transition:width 1s var(--ease)}
.track .band{position:absolute;top:-5px;bottom:-5px;border-radius:6px;background:var(--ok-2);border:1.5px solid var(--ok)}
.axis{position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:6px}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none} .axis span:last-child{transform:translateX(-100%)}
.quest{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding-block:12px}
.quest + .quest{border-top:1px solid var(--line)}
.qi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.qi svg{width:20px;height:20px}
.mini{height:6px;border-radius:999px;background:var(--soft);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:999px;transition:width .8s var(--ease)}
.xp{font-weight:800;font-size:12.5px;color:var(--gold-ink);background:var(--gold-2);padding:3px 8px;border-radius:999px;white-space:nowrap}
.xp.done{color:var(--ok-ink);background:var(--ok-2)}
.note{border-radius:18px;padding:12px 14px;background:var(--gold-2);color:var(--ink);font-size:14.5px;line-height:1.5}
.note b{color:var(--gold-ink)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.quick .btn{min-height:56px;font-size:14.5px;border-radius:16px;flex-direction:column;gap:0;line-height:1.25}
.quick .btn small{font-weight:600;font-size:12px;color:var(--muted)}

/* segmented */
.seg{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* path */
.unitband{border-radius:22px;padding:16px;background:var(--acc);color:var(--on-acc);display:flex;justify-content:space-between;align-items:center;gap:10px}
.unitband small{display:block;font-size:12px;font-weight:700;opacity:.85;letter-spacing:.06em}
.unitband b{font-size:19px;line-height:1.25}
.road{display:grid;gap:22px;padding:8px 0 4px}
.lvl{display:grid;justify-items:center;gap:6px;width:170px;justify-self:center}
.lvl.l{transform:translateX(-62px)} .lvl.r{transform:translateX(62px)}
@media (max-width:380px){.lvl.l{transform:translateX(-44px)} .lvl.r{transform:translateX(44px)}}
.node{width:76px;height:76px;border-radius:50%;position:relative;display:grid;place-items:center;transition:transform .2s var(--ease)}
.node:active{transform:scale(.94)}
.node svg.pr{position:absolute;inset:0;width:76px;height:76px;transform:rotate(-90deg)}
.node .core{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--muted)}
.node .core svg{width:26px;height:26px}
.node.s3 .core{background:var(--gold);color:var(--on-acc)}
.node.cur .core{background:var(--acc);color:var(--on-acc)}
.node.weak .core{background:var(--bad);color:var(--on-acc)}
.node.boss{border-radius:26px} .node.boss .core{width:72px;height:72px;border-radius:24px;background:var(--ink);color:var(--gold)}
.lvl .t{font-size:14px;font-weight:700;text-align:center;line-height:1.25}
.lvl .s{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.3}
.stars{display:inline-flex;gap:2px}
.stars svg{width:14px;height:14px}

/* question */
.qtop{display:flex;align-items:center;gap:12px}
.close{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--card);box-shadow:var(--shadow);flex:none}
.qprog{flex:1;height:10px;border-radius:999px;background:var(--card);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.qprog i{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .5s var(--ease)}
.combo{font-weight:800;color:var(--gold-ink);font-size:14px;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);line-height:1.4}
.tag.rep{background:var(--gold-2);color:var(--gold-ink);box-shadow:none}
.stem{font-size:20px;font-weight:600;line-height:1.5;white-space:pre-line}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;min-height:58px;padding:10px 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:16.5px;font-weight:600;line-height:1.4;transition:transform .15s var(--ease),box-shadow .2s,background .2s}
.opt:active{transform:scale(.99)}
.opt[disabled]{cursor:default}
.opt .k{width:34px;height:34px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.opt .m{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.opt[aria-pressed="true"]{box-shadow:var(--shadow),inset 0 0 0 2px var(--acc)} .opt[aria-pressed="true"] .k{background:var(--acc);color:var(--on-acc)}
.opt.right{background:var(--ok-2);box-shadow:inset 0 0 0 2px var(--ok)} .opt.right .k{background:var(--ok);color:var(--on-acc)} .opt.right .m{color:var(--ok-ink)}
.opt.wrong{background:var(--bad-2);box-shadow:inset 0 0 0 2px var(--bad)} .opt.wrong .k{background:var(--bad);color:var(--on-acc)} .opt.wrong .m{color:var(--bad-ink)}
.why{display:flex;flex-wrap:wrap;gap:6px}
.why button{background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;transition:background .2s,color .2s}
.why button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.ai{white-space:pre-wrap;font-size:14.5px;padding:10px 12px;border-radius:14px;background:var(--card);margin:0}
ul.cpts{margin:0;padding-left:1.1rem;display:grid;gap:6px;font-size:15px;line-height:1.5}

/* sheets and bars */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);z-index:31;max-height:82vh;overflow-y:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px rgb(0 0 0/.12)}
.sheet.anim{animation:up .4s var(--ease)}
@keyframes up{from{transform:translate(-50%,100%)}}
.sheet.good{background:var(--ok-2)} .sheet.badd{background:var(--bad-2)}
.sheet .v{font-size:22px;font-weight:800} .sheet.good .v{color:var(--ok-ink)} .sheet.badd .v{color:var(--bad-ink)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-top:-8px}
.abar{position:fixed;left:50%;transform:translateX(-50%);width:min(480px,100%);bottom:0;z-index:20;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.abar .in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);width:min(452px,calc(100% - 28px));bottom:calc(14px + env(safe-area-inset-bottom,0px));height:68px;border-radius:24px;background:var(--bar);box-shadow:0 10px 30px rgb(0 0 0/.12),0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:20;transition:opacity .25s,transform .3s var(--ease)}
.tabs.hide{opacity:0;pointer-events:none;transform:translate(-50%,24px)}
.tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:18px;background:var(--acc-2);transition:transform .4s var(--ease)}
.tabs button{position:relative;z-index:1;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);transition:color .25s}
.tabs button svg{width:24px;height:24px}
.tabs .fi{display:none}
.tabs button[aria-current="page"]{color:var(--acc)}
.tabs button[aria-current="page"] .fi{display:block} .tabs button[aria-current="page"] .ol{display:none}
.xpfloat{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;font-weight:800;color:var(--gold-ink);background:var(--gold-2);padding:6px 14px;border-radius:999px;pointer-events:none;animation:fl 1.6s var(--ease) forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:45;font-size:14.5px;max-width:calc(100% - 32px);font-weight:600}

/* exam */
.ebar{display:flex;align-items:center;gap:10px}
.clock{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad-ink)}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.omr button{background:var(--soft);border-radius:10px;height:40px;font-weight:700;font-size:13px;position:relative}
.omr button.a{background:var(--acc);color:var(--on-acc)}
.omr button.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.omr button.fl::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.omr button.r{background:var(--ok-2);color:var(--ok-ink)} .omr button.w{background:var(--bad-2);color:var(--bad-ink)}
.omr .sec{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.series{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.sno{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--acc-2);color:var(--acc)}
.sno.best{background:var(--gold-2);color:var(--gold-ink)}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:18px;padding:12px 8px;text-align:center;background:var(--card);box-shadow:var(--shadow)}
.tile b{display:block;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.sbar{display:grid;grid-template-columns:6.2rem 1fr 4.4rem;gap:10px;align-items:center;font-size:14.5px}
.sbar .mini{margin:0;height:8px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:700;text-align:center;line-height:1.25}
.bdg span{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--gold-2);color:var(--gold-ink)}
.bdg svg{width:26px;height:26px}
.bdg.off{color:var(--muted)} .bdg.off span{background:var(--soft);color:var(--muted);opacity:.7}
.bars14{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:80px}
.bars14 div{background:var(--acc);border-radius:4px 4px 0 0;min-height:3px}
.bars14 div.z{background:var(--soft)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.strong{background:var(--ok-2);color:var(--ok-ink)} .chip.shaky{background:var(--gold-2);color:var(--gold-ink)} .chip.weak{background:var(--bad-2);color:var(--bad-ink)} .chip.new{background:var(--soft);color:var(--muted)}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";float:right;color:var(--muted);font-weight:800}
details[open] summary::after{content:"–"}
details[open] summary{margin-bottom:10px}
.src{display:grid;gap:2px;padding-block:10px;border-top:1px solid var(--line)}
.src:first-child{border-top:0;padding-top:0}
.empty{padding:22px;text-align:center;border:1.5px dashed var(--line);border-radius:18px;display:grid;gap:8px;justify-items:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <main id="view" aria-live="polite"></main>
</div>
<div id="overlay"></div>
<div id="abar"></div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <span class="ind" id="ind"></span>
  <button data-act="tab" data-tab="home"><svg class="ol" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><svg class="fi" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z" fill="currentColor"/></svg>Home</button>

<script id="bank" type="application/json">__BANK__</script>
<script>
"use strict";

const yrs = q => q.yrs && q.yrs.length ? `Asked ${q.yrs.join(", ")}` : "";
const ICON = {
  flame: '<path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z" fill="var(--flame)"/>',

  play: '<path d="M8 5v14l11-7z" fill="currentColor"/>',

  clock: '<circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 9v4l3 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>',
  cup: '<path d="M7 4h10v4a5 5 0 0 1-10 0z" fill="currentColor"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 14h4v3h-4zM8 19h8v2H8z" fill="currentColor"/>',

  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/>',
  repeat: '<path d="M4 12a7 7 0 0 1 12-5l2 2M20 12a7 7 0 0 1-12 5l-2-2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18 4v5h-5M6 20v-5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
  book: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z" fill="none" stroke="currentColor" stroke-width="2"/>',
  lock: '<rect x="6" y="11" width="12" height="9" rx="2" fill="currentColor"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3" stroke="currentColor" stroke-width="2.2" fill="none"/>',
  arrow: '<path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>',

const svg = (k, size = 20) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${ICON[k]}</svg>`;

/* ── state: localStorage first, mirrored to the viewer's private db doc when available ── */
const KEY = "cee150.v1", MKEY = "cee150.mock";
const blank = () => ({v:1, updated:0, examDate:RAW.meta.examDate || "", neg:RAW.meta.neg ?? 0, target:170, th:{}, it:{}, log:[], mocks:[], days:{}, custom:[],
  xp:0, streak:{n:0, last:"", best:0, freeze:1}, t:{}, stars:{}, why:{}, fixed:0, proj:{}, look:"auto", wk:{w:"", xp:0}, group:false, xs:[]});
function loadLocal() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return Object.assign(blank(), s); } catch (e) {} return blank(); }
let S = loadLocal();
if (S.target < 160) S.target = 170;
let QS = [], QI = {};
function rebuild() {
  QS = [];
  for (const f of RAW.subjects) for (const q of f.questions) QS.push({...q, subject: f.subject, src: "bank"});
  for (const q of S.custom) if (TOP[q.topic]) QS.push({...q, subject: TOP[q.topic].subject});
  QI = Object.fromEntries(QS.map(q => [q.id, q]));
}
rebuild();

let userCap = null, groupState = null, lastLeague = "";
let db = null, uid = null, syncT = null, syncing = false, dirty = false, customDirty = false;
function save(custom) {
  S.updated = Date.now();
  if (S.log.length > 1500) S.log = S.log.slice(-1500); // ponytail: aggregates live in th/it; the raw log only feeds speed + activity
  const d = dayKey(); if (!S.proj[d] && answered() > 0) { S.proj[d] = Math.round(project().tot); const ks = Object.keys(S.proj).sort(); if (ks.length > 30) delete S.proj[ks[0]]; }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (custom) customDirty = true;
  if (db) { dirty = true; clearTimeout(syncT); syncT = setTimeout(flush, 4000); }
}
async function flush() {
  if (!db || !dirty || syncing) return;
  syncing = true; dirty = false;
  const {custom, ...rest} = S;
  try {
    await db.doc(`data/users/${uid}/state`).set({updated: S.updated, json: JSON.stringify(rest)});
    if (customDirty) {
      // ponytail: one db document holds 256 KiB, so added questions are split into ~150 KiB chunks
      const chunks = []; let cur = [];
      for (const q of custom) { cur.push(q); if (JSON.stringify(cur).length > 150000) { chunks.push(cur); cur = []; } }
      if (cur.length || !chunks.length) chunks.push(cur);
      for (let i = 0; i < chunks.length; i++) await db.doc(`data/users/${uid}/custom-${i}`).set({json: JSON.stringify(chunks[i])});
      await db.doc(`data/users/${uid}/custom`).set({n: chunks.length});
      customDirty = false;
    }
    const lk = `${S.wk.w}:${S.wk.xp}:${S.streak.n}`;
    if (S.group && lk !== lastLeague) { await db.doc(`league/${uid}`).set({w: S.wk.w, xp: S.wk.xp, streak: S.streak.n, updated: Date.now()}); lastLeague = lk; }
  } catch (e) { dirty = true; }
  syncing = false;
}
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
(async () => {
  if (!window.claude) return;
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    uid = u && await u.id(); userCap = u;
    if (!d || !uid) return;
    const [st, cu] = await Promise.all([d.doc(`data/users/${uid}/state`).get(), d.doc(`data/users/${uid}/custom`).get()]);
    db = d;
    if (st.exists && (st.data().updated || 0) > S.updated) {
      S = Object.assign(blank(), JSON.parse(st.data().json));
      const cd = cu.exists ? cu.data() : {};
      if (cd.json) S.custom = JSON.parse(cd.json);
      else { S.custom = []; for (let i = 0; i < (cd.n || 0); i++) { const c = await d.doc(`data/users/${uid}/custom-${i}`).get(); if (c.exists) S.custom.push(...JSON.parse(c.data().json || "[]")); } }
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      rebuild(); applyLook(); if (!pr && !mk) render();
    } else if (S.updated > (st.exists ? st.data().updated || 0 : 0)) { dirty = true; customDirty = true; flush(); }
  } catch (e) { db = null; }
})();
let sample = null;
(async () => { if (window.claude) { try { sample = await claude.use("sample"); } catch (e) {} if (sample && !mk && !pr) render(); } })();

/* ── look: Calm by day, Calm night 18:00–06:00 unless chosen ── */
function applyLook() {
  const h = new Date().getHours();
  const night = S.look === "night" || (S.look === "auto" && (h >= 18 || h < 6));
  document.documentElement.dataset.look = night ? "night" : "calm";
}
applyLook(); setInterval(applyLook, 60e3);

/* ── psychometrics: Elo-style Rasch estimate per unit and per subject, with a 4-option guessing floor ── */
const BD = {1:-1, 2:0, 3:1}, PRIOR = -0.6, TYP = 0.3;
const sig = x => 1 / (1 + Math.exp(-x));
const P = (t, b) => 0.25 + 0.75 * sig(1.5 * (t - b));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
// accuracy needed on attempted questions to reach the target with negative marking: net = p − neg(1 − p)
const goalP = () => clamp((S.target / 200 + S.neg) / (1 + S.neg), 0.5, 0.97);
function thetaOf(tid) {
  const s = S.th[TOP[tid].subject], t = S.th[tid];
  const st = s ? s.t : PRIOR;
  if (!t) return st;
  const w = t.n / (t.n + 4);
  return w * t.t + (1 - w) * st;
}
const pTopic = tid => P(thetaOf(tid), TYP);
function stars(tid) {
  const o = S.th[tid]; if (!o || o.n < 4) return 0;
  const p = pTopic(tid), g = goalP();
  return p >= g ? 3 : p >= g - 0.12 ? 2 : p >= g - 0.25 ? 1 : 0;
}
function today() { const d = dayKey(); if (S.t.d !== d) S.t = {d, right: 0, fixed: 0, rep: 0, exam: 0, q: {}}; return S.t; }
function touchStreak() {
  const d = dayKey(), st = S.streak;
  if (st.last === d) return;
  const gap = st.last ? Math.round((new Date(d) - new Date(st.last)) / DAY) : 99;
  if (gap === 1) st.n++;
  else if (gap === 2 && st.freeze > 0) { st.freeze--; st.n++; toast("A streak freeze saved your streak."); }
  else st.n = 1;
  st.last = d; st.best = Math.max(st.best, st.n);
  if (st.n % 7 === 0 && st.freeze < 2) { st.freeze++; toast("7 days in a row. You earned a streak freeze."); }
}
let xpQueue = 0;
// study weeks start on Sunday, as in Nepal
const weekKey = () => { const d = new Date(dayKey() + "T12:00:00"); d.setDate(d.getDate() - d.getDay()); return d.toLocaleDateString("en-CA"); };
function addXP(n) { if (n > 0) { S.xp += n; xpQueue += n; const w = weekKey(); if (S.wk.w !== w) S.wk = {w, xp: 0}; S.wk.xp += n; } }
function record(q, ok, sure, secs, mode = "practice") {
  const b = BD[q.d] || 0, r = ok ? (sure ? 1 : 0.7) : 0;
  const init = thetaOf(q.topic), before = stars(q.topic);
  for (const key of [q.topic, q.subject]) {
    const o = S.th[key] || {t: key === q.topic ? init : PRIOR, n: 0, c: 0};
    const K = Math.max(0.12, 0.9 / (1 + 0.06 * o.n));
    o.t = clamp(o.t + K * (r - P(o.t, b)), -3, 3); o.n++; o.c = (o.c || 0) + (ok ? 1 : 0);
    S.th[key] = o;
  }
  // successive relearning: missed → same session, then 1, 3, 7, 14 days; retired after a clean run
  const now = Date.now(), I = [0, 1, 3, 7, 14];
  const it = S.it[q.id] || {n: 0, c: 0, box: -1, mis: 0};
  const first = it.n === 0, wasMistake = it.mis > 0 && it.box === 0;
  it.n++;
  if (ok) { it.c++; it.box = !sure ? 1 : first ? 3 : it.box >= 4 ? 5 : it.box + 1; }
  else { it.box = 0; if (sure) it.mis++; }
  it.due = it.box === 5 ? 0 : it.box === 0 ? now + 10 * 60e3 : now + I[it.box] * DAY;
  it.last = now; it.ok = ok; it.sure = sure;
  S.it[q.id] = it;
  S.log.push([now, q.id, ok ? 1 : 0, sure ? 1 : 0, Math.round(secs)]);
  const d = dayKey(); S.days[d] = (S.days[d] || 0) + 1;
  // rewards follow learning, not time: XP only for right answers and for units moving up
  const t = today();
  if (ok) { t.right++; if (q.rep) t.rep++; addXP(mode === "exam" ? 4 : sure ? 10 : 5); }
  if (ok && wasMistake) { t.fixed++; S.fixed++; }
  const after = stars(q.topic), had = S.stars[q.topic] || 0;
  if (after > had) { addXP(25 * (after - had)); S.stars[q.topic] = after; if (mode !== "exam") toast(`${TOP[q.topic].name}: ${after} ${after === 1 ? "star" : "stars"}`); }
  touchStreak();
  checkQuests();
}
function project() {
  const by = {}; let tot = 0;
  for (const s of SUBJ) {
    let m = 0;
    for (const t of TOPS_BY[s.k] || []) { const p = pTopic(t.id); m += t.w * (p - S.neg * (1 - p)); }
    by[s.k] = Math.max(0, m); tot += by[s.k];
  }

}
const answered = () => Object.values(S.it).reduce((a, i) => a + i.n, 0);
const gain = t => t.w * Math.max(0, goalP() - pTopic(t.id)) * (1 + S.neg);
const ranked = () => Object.values(TOP).map(t => ({t, g: gain(t)})).sort((a, b) => b.g - a.g);
const dueList = (pool = QS) => { const now = Date.now(); return pool.filter(q => { const i = S.it[q.id]; return i && i.box >= 0 && i.box < 5 && i.due <= now; }); };
const misList = () => QS.filter(q => (S.it[q.id] || {}).mis > 0 && (S.it[q.id] || {}).box < 5);
function level(tid) {
  const o = S.th[tid];
  if (!o || o.n < 2) return ["new", "Not tested"];
  const p = pTopic(tid), g = goalP();
  return p >= g ? ["strong", "Strong"] : p >= g - 0.2 ? ["shaky", "Shaky"] : ["weak", "Weak"];
}

/* ── game layer ── */
const LEVELS = [[0, "Aspirant"], [200, "Learner"], [600, "Reader"], [1200, "Solver"], [2000, "Achiever"], [3000, "Intern"], [4500, "Resident"], [6500, "Registrar"], [9000, "Consultant"], [12000, "Topper"]];
function lvl() { let i = 0; while (i + 1 < LEVELS.length && S.xp >= LEVELS[i + 1][0]) i++; const next = LEVELS[i + 1]; return {n: i + 1, name: LEVELS[i][1], from: LEVELS[i][0], to: next ? next[0] : null}; }

function quests() {
  const t = today(), fixQuest = misList().length > 0 || t.fixed > 0;
  return [
    {id: "right", name: "Get 40 right", need: 40, val: t.right, xp: 50, icon: "check", c: "acc"},
    fixQuest ? {id: "fix", name: "Fix 5 confident mistakes", need: 5, val: t.fixed, xp: 40, icon: "bang", c: "bad"}
             : {id: "rep", name: "20 right on repeated questions", need: 20, val: t.rep, xp: 40, icon: "repeat", c: "bad"},
    {id: "exam", name: "Finish a sprint or exam", need: 1, val: t.exam, xp: 60, icon: "clock", c: "gold"}
  ];
}
function checkQuests() {
  const t = today();
  for (const q of quests()) if (q.val >= q.need && !t.q[q.id]) { t.q[q.id] = 1; addXP(q.xp); toast(`Quest done: ${q.name}. +${q.xp} XP`); }
}
const BADGES = [
  {id: "streak7", name: "7-day streak", icon: "flame", ok: () => S.streak.best >= 7},
  {id: "master1", name: "First unit mastered", icon: "star", ok: () => Object.values(S.stars).some(v => v >= 3)},
  {id: "a100", name: "100 answers", icon: "check", ok: () => answered() >= 100},
  {id: "a500", name: "500 answers", icon: "check", ok: () => answered() >= 500},
  {id: "fix50", name: "50 mistakes fixed", icon: "bang", ok: () => S.fixed >= 50},
  {id: "allu", name: "Every unit tried", icon: "book", ok: () => Object.keys(TOP).every(id => (S.th[id] || {}).n >= 2)},
  {id: "s150", name: "150 in a paper", icon: "cup", ok: () => S.mocks.some(m => m.n >= 100 && m.scaled >= 150)},
  {id: "s170", name: "170 in a paper", icon: "cup", ok: () => S.mocks.some(m => m.n >= 100 && m.scaled >= 170)}
];

/* ── session builder: due reviews first, then units ranked by marks-to-gain, items near 70% success, interleaved ── */
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function interleave(ids) {
  const out = [], rest = [...ids];
  while (rest.length) {
    const prev = out.length ? QI[out[out.length - 1]].topic : null;
    let k = rest.findIndex(id => QI[id].topic !== prev); if (k < 0) k = 0;
    out.push(rest.splice(k, 1)[0]);
  }
  return out;
}
function buildSession(n, f = {}) {
  let pool = QS.filter(q => (!f.subject || q.subject === f.subject) && (!f.topic || q.topic === f.topic));
  if (f.kind === "placement") {
    const ids = Object.values(TOP).map(t => { const c = pool.filter(q => q.topic === t.id); return (c.find(q => q.d === 2 && !S.it[q.id]) || c.find(q => !S.it[q.id]) || c[0] || {}).id; }).filter(Boolean);
    return interleave(shuffle(ids));
  }
  if (f.kind === "mis") return shuffle(misList().map(q => q.id)).slice(0, n);
  if (f.kind === "repeat") {
    pool = pool.filter(q => q.rep > 0);
    const fresh = pool.filter(q => !S.it[q.id] || !S.it[q.id].ok).sort((a, b) => (b.rep - a.rep) || (Math.random() - 0.5));
    return interleave(fresh.slice(0, n).map(q => q.id));
  }
  if (f.kind === "warmup") return shuffle(pool.filter(q => !S.it[q.id]).map(q => q.id)).slice(0, n);
  const due = dueList(pool).sort((a, b) => (S.it[b.id].mis - S.it[a.id].mis) || (S.it[a.id].due - S.it[b.id].due));
  const out = due.slice(0, f.kind === "review" ? n : Math.round(n * 0.4)).map(q => q.id);
  if (f.kind === "review") return interleave(out);
  const used = new Set(out);
  let tops = [...new Set(pool.map(q => q.topic))].map(id => ({id, p: gain(TOP[id]) + ((S.th[id] || {}).n < 3 ? TOP[id].w * 0.25 : 0) + 0.05}));
  while (out.length < n && tops.length) {
    let r = Math.random() * tops.reduce((a, t) => a + t.p, 0), t = tops[0];
    for (const x of tops) { r -= x.p; if (r <= 0) { t = x; break; } }
    const th = thetaOf(t.id);
    const cand = pool.filter(q => q.topic === t.id && !used.has(q.id))
      .map(q => ({q, s: (S.it[q.id] ? 0.6 : 0) + Math.abs(P(th, BD[q.d] || 0) - 0.7) - (q.rep ? 0.05 * Math.min(q.rep, 4) : 0) + Math.random() * 0.08}))
      .sort((a, b) => a.s - b.s);
    if (!cand.length) { tops = tops.filter(x => x !== t); continue; }
    used.add(cand[0].q.id); out.push(cand[0].q.id);
  }

}

/* ── practice run ── */
let pr = null, mk = null, tab = "home", flt = {subj: "", q: ""}, pathSubj = null, importDraft = null, confirmReset = false, aiState = {}, unitSheet = null, eyeSheet = null;
const LABELS = {smart: "Smart session", review: "Review due", placement: "Placement check", mis: "Confident mistakes", repeat: "Repeated questions", warmup: "Warm-up"};
function startPractice(kind, opts = {}) {
  if (mk && !mk.result) { go("exams"); toast("Finish or submit the running exam first."); return; }

  if (!qs.length) { toast(kind === "review" ? "Nothing is due for review right now." : "No new questions left there. Try a smart session."); return; }

function buildPaper(scale, only) {
  const ids = [];
  const seen = new Set(S.mocks.flatMap(m => m.ids || []));
  for (const s of SUBJ) {
    if (only && s.k !== only) continue;
    const need = Math.round(s.m * scale);
    const pool = QS.filter(q => q.subject === s.k && q.src === "bank");
    const cnt = {}; pool.forEach(q => cnt[q.topic] = (cnt[q.topic] || 0) + 1);
    // weighted sampling without replacement (Efraimidis–Spirakis): units appear in proportion to their exam weight
    const keyed = pool.map(q => ({id: q.id, k: Math.pow(Math.random(), 1 / ((TOP[q.topic].w / cnt[q.topic]) * (seen.has(q.id) ? 0.3 : 1)))}));
    keyed.sort((a, b) => b.k - a.k);
    ids.push(...keyed.slice(0, need).map(x => x.id));
  }
  return ids;
}
// More series on demand: official count per unit; questions least used in your earlier papers first, repeated topics next.
// ponytail: ~9 fully fresh papers fit in the bank; after that the least-seen questions return, which doubles as spaced review
function makeSeries() {
  const used = {};
  const papers = [...SERIES.filter((_, k) => S.mocks.some(m => m.series === k)).map(x => x.ids), ...S.xs.map(x => x.ids), ...S.mocks.map(m => m.ids || [])];
  papers.forEach(ids => ids.forEach(id => used[id] = (used[id] || 0) + 1));
  const ids = [];
  for (const sj of SUBJ) for (const t of TOPS_BY[sj.k] || []) {
    const pool = QS.filter(q => q.topic === t.id && q.src === "bank")
      .map(q => ({id: q.id, k: (used[q.id] || 0) * 10 - (q.rep || 0) + Math.random()})).sort((a, b) => a.k - b.k);
    ids.push(...pool.slice(0, t.weight).map(x => x.id));
  }
  const name = `Series ${SERIES.length + S.xs.length + 1}`;
  S.xs.push({name, ids, fresh: ids.filter(id => !used[id]).length}); save();
  return S.xs.length - 1;
}

const noteHtml = c => / \[repeat\]$/.test(c) ? `${esc(c.replace(/ \[repeat\]$/, ""))} <span class="chip shaky">Repeated</span>` : esc(c);

function vSummary() {
  const r = pr.res, ok = r.filter(x => x.ok).length, sure = r.filter(x => x.sure), sureOk = sure.filter(x => x.ok).length;

  const med = r.length ? r.map(x => x.secs).sort((a, b) => a - b)[Math.floor(r.length / 2)] : 0;
  const ups = Object.keys(S.stars).filter(k => (S.stars[k] || 0) > (pr.stars0[k] || 0));
  return `<div style="display:grid;gap:8px;text-align:center;padding-top:20px">
      <div style="width:84px;height:84px;border-radius:28px;background:var(--gold-2);color:var(--gold);display:grid;place-items:center;justify-self:center">${svg("cup", 44)}</div>

    <div class="tiles"><div class="tile"><span class="lab">XP</span><b style="color:var(--gold-ink)">+${S.xp - pr.xp0}</b></div><div class="tile"><span class="lab">Sure & right</span><b style="color:var(--ok-ink)">${sure.length ? Math.round(sureOk / sure.length * 100) : "–"}%</b></div><div class="tile"><span class="lab">Speed</span><b>${Math.round(med)}s</b></div></div>
    ${ups.length ? `<div class="card stack"><span class="lab">Units moved up</span>${ups.map(k => `<div class="row between"><span>${esc(TOP[k].name)}</span>${starRow(S.stars[k], 16)}</div>`).join("")}</div>` : ""}
    <div class="card row between"><div><b>Projected ${Math.round(after)} / 200</b><div class="small muted">${d >= 0 ? "+" : ""}${d.toFixed(1)} this session</div></div><div class="row" style="gap:6px;color:var(--flame);font-weight:800">${svg("flame", 26)}<span class="tn" style="color:var(--ink)">${S.streak.n}</span></div></div>
    ${conf.length ? `<div class="card stack"><b>${conf.length} confident ${conf.length === 1 ? "mistake" : "mistakes"} found</b><p class="small muted">You were sure, but wrong. They come back first in your next review, when fixing them sticks best.</p></div>` : ""}

}

function vExams() {
  if (mk && mk.result) return vExamResult();
  if (mk && mk.pre) return vExamPre();
  if (mk) return vExamQ();
  const best = k => { const ms = S.mocks.filter(m => m.series === k); return ms.length ? Math.max(...ms.map(m => m.scaled)) : null; };
  return `${hud()}<h1>Exams</h1>
    <p class="small muted" style="margin-top:-6px">Full papers with the official pattern: 200 questions, 3 hours, −${S.neg} per wrong answer, units in their exact syllabus counts. Series 1 holds the most-repeated topics from 2078–2082 papers.</p>
    ${SERIES.map((s, k) => { const b = best(k), n = S.mocks.filter(m => m.series === k).length; return `<div class="card series"><span class="sno ${n ? "best" : ""}">${k + 1}</span><div><b>${esc(s.name)}</b><div class="small muted">${n ? `best <b class="tn" style="color:var(--ink)">${Math.round(b)}</b> / 200 · ${n} ${n === 1 ? "try" : "tries"}` : "Not taken yet"}</div></div><button class="btn ${n ? "sec" : ""} sm" data-act="series" data-k="${k}">${n ? "Retake" : "Start"}</button></div>`; }).join("")}
    ${S.xs.map((x, j) => { const key = "x" + j, ms = S.mocks.filter(m => m.series === key), b = ms.length ? Math.max(...ms.map(m => m.scaled)) : null; return `<div class="card series"><span class="sno ${ms.length ? "best" : ""}">${SERIES.length + j + 1}</span><div><b>${esc(x.name)}</b><div class="small muted">${ms.length ? `best <b class="tn" style="color:var(--ink)">${Math.round(b)}</b> / 200 · ${ms.length} ${ms.length === 1 ? "try" : "tries"}` : `${x.fresh} of 200 questions new to your papers`}</div></div><button class="btn ${ms.length ? "sec" : ""} sm" data-act="xseries" data-k="${j}">${ms.length ? "Retake" : "Start"}</button></div>`; }).join("")}
    <button class="btn sec" data-act="makeseries">Make Series ${SERIES.length + S.xs.length + 1}</button>
    <div class="note"><b>How many papers?</b> No study gives a magic number. What raises scores is a full timed paper about every second day, plus reviewing every mistake right after it (Adesope et al., 2017; Rawson et al., 2013). With ${Math.max(0, daysLeft() ?? 0)} days left that is about ${Math.max(1, Math.ceil(Math.max(0, (daysLeft() ?? 0) - 1) / 2))} more full papers. On other days, use smart sessions and half papers.</div>
    <span class="lab" style="margin-top:4px">Quick rounds</span>
    <div class="grid2b"><button class="btn sec" data-act="quick" data-scale="0.1" data-label="Sprint">Sprint · 20 Q</button><button class="btn sec" data-act="quick" data-scale="0.5" data-label="Half paper">Half · 100 Q</button></div>
    <div class="seg" role="group" aria-label="Subject boss rounds">${SUBJ.map(s => `<button data-act="boss" data-k="${s.k}">${s.k} · ${s.m}</button>`).join("")}</div>
    <div class="note"><b>Guessing with −${S.neg} marking.</b> A blind guess earns about +0.06 on average. Rule out one option and answering is worth +0.17; rule out two and it's +0.38. So answer almost everything. Leave blank only what you can't narrow at all.</div>
    ${S.mocks.length ? `<div class="card stack"><span class="lab">Your papers</span><div class="tbl"><table><thead><tr><th>Date</th><th>Paper</th><th class="n">Right</th><th class="n">Wrong</th><th class="n">/200</th></tr></thead><tbody>
      ${S.mocks.slice().reverse().map(m => `<tr><td>${new Date(m.ts).toLocaleDateString(undefined, {month: "short", day: "numeric"})}</td><td>${esc(m.label)}</td><td class="n">${m.right}</td><td class="n">${m.wrong}</td><td class="n"><b>${Math.round(m.scaled)}</b></td></tr>`).join("")}</tbody></table></div></div>` : ""}`;
}
function vExamPre() {
  return `<div style="padding-top:12px"></div><h1>${esc(mk.label)}</h1>
    <p class="muted">${mk.qs.length} questions · ${Math.round(mk.dur / 60)} minutes · −${S.neg} per wrong answer</p>
    <div class="card stack"><span class="lab">Two minutes before you start</span>

}

function vProgress() {

  const secs = S.log.slice(-200).map(x => x[4]).sort((a, b) => a - b), med = secs.length ? secs[Math.floor(secs.length / 2)] : 0;
  const days = [...Array(14)].map((_, i) => S.days[new Date(Date.now() - (13 - i) * DAY - 4 * 3600e3).toLocaleDateString("en-CA")] || 0);
  const mx = Math.max(20, ...days);
  const whys = Object.entries(S.why).sort((a, b) => b[1] - a[1]);
  const TIP = {"Didn't know it": "Read that unit's notes right after the session, then do a warm-up tomorrow.", "Mixed up two terms": "Make a two-column list of the look-alike terms and test yourself on it.", "Misread": "Slow down on the stem: find the key word (NOT, EXCEPT, maximum) before reading options.", "Rushed": "You have 54 s a question. Use the full time on the ones you can solve.", "Calculation slip": "Write units at every step and check the answer's size makes sense."};
  const rows = ranked().map(({t, g}) => { const o = S.th[t.id] || {}; return `<tr><td>${esc(t.name)}<div class="small muted">${esc(t.subject)} · ${t.weight} Q</div></td><td class="n">${o.n ? `${o.c || 0}/${o.n}` : "–"}</td><td>${starRow(stars(t.id), 12)}</td><td class="n"><b>${g.toFixed(1)}</b></td></tr>`; }).join("");

    <div class="card stack"><div class="row between"><span class="lab">Projected score</span><span class="small muted">${n} answers · ${n < 60 ? "rough" : n < 200 ? "fair" : "good"} estimate</span></div>
      <div class="row" style="align-items:baseline;gap:6px"><span class="score tn">${Math.round(pj.tot)}</span><span class="muted">/ 200 · target ${S.target}</span></div>
      ${SUBJ.map(s => `<div class="sbar"><span>${esc(s.k)}</span><div class="mini"><i style="width:${pj.by[s.k] / s.m * 100}%;background:var(--acc)"></i></div><span class="tn" style="text-align:right">${pj.by[s.k].toFixed(1)}/${s.m}</span></div>`).join("")}</div>
    <div class="card stack"><span class="lab">Badges</span><div class="badges">${BADGES.map(b => `<div class="bdg ${b.ok() ? "" : "off"}"><span>${svg(b.icon, 26)}</span>${b.name}</div>`).join("")}</div></div>

    <details class="card"><summary>All units, most marks to gain first</summary><p class="small muted">Gain = marks added by reaching ${Math.round(goalP() * 100)}% in that unit.</p><div class="tbl"><table><thead><tr><th>Unit</th><th class="n">You</th><th>Stars</th><th class="n">Gain</th></tr></thead><tbody>${rows}</tbody></table></div></details>

let photo = null;
async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onload = res; sc.onerror = rej; document.head.append(sc); });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return window.pdfjsLib;
}
async function pdfPages(file, max) {
  const lib = await loadPdfJs(), doc = await lib.getDocument({data: await file.arrayBuffer()}).promise, out = [];
  for (let i = 1; i <= Math.min(doc.numPages, max); i++) {
    const page = await doc.getPage(i), vp = page.getViewport({scale: 1.6}), c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
    out.push(await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)));
  }
  return {blobs: out, total: doc.numPages};
}
const norm = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
async function readPhotos(files) {
  const MAXP = 30; // ponytail: 30 pages per run keeps one import inside a few minutes; run again for more
  const lim = sample ? await sample.limits().catch(() => null) : null;
  if (!lim || !lim.images) { photo = {msg: "Reading photos needs the app opened in Claude, with photo reading allowed."}; render(); return; }
  const ctl = new AbortController();
  photo = {busy: true, ctl, msg: "Preparing pages…", items: [], skipped: 0}; render();
  let blobs = [], dropped = 0;
  try {
    for (const f of files) {
      if (blobs.length >= MAXP) { dropped++; continue; }
      if (f.type === "application/pdf") { const r = await pdfPages(f, MAXP - blobs.length); blobs.push(...r.blobs); dropped += r.total - r.blobs.length; }
      else if (/^image\/(jpeg|png|webp|gif)$/.test(f.type)) blobs.push(f);
      else photo.skipped++;
    }
  } catch (e) { photo = {msg: "That PDF could not be opened. Try screenshots of its pages instead."}; render(); return; }
  if (!blobs.length) { photo = {msg: "No pages to read. Pick JPG, PNG or PDF files."}; render(); return; }
  const per = Math.max(1, Math.min(lim.images.maxCount || 1, 3));
  const units = Object.values(TOP).map(t => `${t.id} = ${t.subject}: ${t.name}`).join("\n");
  const have = new Set(QS.map(q => norm(q.q)));
  for (let i = 0; i < blobs.length && !ctl.signal.aborted; i += per) {
    photo.msg = `Reading page ${i + 1}${per > 1 ? "–" + Math.min(i + per, blobs.length) : ""} of ${blobs.length}…`; render();
    const prompt = `These images are pages of multiple-choice practice questions that a Nepali student is studying for the MECEE-BL (MBBS entrance). The student wants them in their private practice app.
For every COMPLETE question with four options on these pages, return one object. Copy the question and options as written (fix obvious OCR-style errors only). Skip partial or unreadable questions.
"unit": the best matching id from this list:
${units}
"a": index 0-3 of the correct option. If an answer key or marked answer is printed on the page, use it and set "key":"page". Otherwise solve it yourself carefully and set "key":"solved".
"x": a short explanation (under 40 words) of why that answer is right.
Reply with only a JSON array: [{"q": string, "o": [4 strings], "a": number, "unit": string, "key": "page"|"solved", "x": string}]. Reply [] if there are no complete questions.`;
    try {
      const arr = await sample.json(prompt, {images: blobs.slice(i, i + per), signal: ctl.signal, cache: false});
      for (const o of Array.isArray(arr) ? arr : []) {
        const ok = o && typeof o.q === "string" && o.q.trim() && Array.isArray(o.o) && o.o.length === 4 && o.o.every(v => typeof v === "string" && v.trim()) && Number.isInteger(o.a) && o.a >= 0 && o.a < 4 && TOP[o.unit];
        if (!ok) { photo.skipped++; continue; }
        const k = norm(o.q); if (have.has(k)) { photo.dupes = (photo.dupes || 0) + 1; continue; }
        have.add(k); photo.items.push({q: o.q.trim(), o: o.o.map(v => v.trim()), a: o.a, topic: o.unit, x: String(o.x || ""), keySrc: o.key === "page" ? "page" : "solved"});
      }
    } catch (e) {
      if (e.code === "cancelled") break;
      if (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "images_unavailable") { photo.msg = "Photo reading was not allowed, so nothing more was read."; photo.busy = false; render(); return; }
      if (e.code === "rate_limited") { photo.msg = `Paused: too many requests. ${photo.items.length} questions found so far; add them, then try the rest later.`; photo.busy = false; render(); return; }
      photo.skipped++;
    }
  }
  photo.busy = false;
  photo.msg = `${photo.items.length} new ${photo.items.length === 1 ? "question" : "questions"} found on ${blobs.length} ${blobs.length === 1 ? "page" : "pages"}.` + (photo.dupes ? ` ${photo.dupes} already in your bank were left out.` : "") + (photo.skipped ? ` ${photo.skipped} could not be read.` : "") + (dropped ? ` ${dropped} pages over the ${MAXP}-page limit were not read; pick them next.` : "");
  render();
}

function parseImport(txt) {
  const out = [], bad = [];
  for (const block of txt.split(/\n\s*\n/)) {
    const lines = block.split("\n").map(s => s.trim()).filter(Boolean);
    if (!lines.length) continue;
    const q = [], o = [null, null, null, null]; let a = -1, x = "", m;
    for (const l of lines) {
      if ((m = l.match(/^(?:ans(?:wer)?|key|correct)\s*[:.\-)]?\s*\(?([A-Da-d])\)?\b/i))) a = "abcd".indexOf(m[1].toLowerCase());
      else if ((m = l.match(/^(?:exp(?:lanation)?|sol(?:ution)?)\s*[:.\-]\s*(.*)$/i))) x = m[1];
      else if ((m = l.match(/^\(?([A-Da-d])[).:]\s*(.+)$/))) o["abcd".indexOf(m[1].toLowerCase())] = m[2];
      else if (x) x += " " + l;
      else q.push(l.replace(/^(?:q(?:uestion)?\s*\d*\s*[:.)]|\d+\s*[.)])\s*/i, ""));
    }
    if (q.length && o.every(Boolean) && a >= 0) out.push({q: q.join(" "), o, a, x}); else bad.push(lines[0]);
  }
  return {out, bad};
}

  imparse: () => { const text = $("#impText").value; importDraft = {text, topic: $("#impTopic").value, parsed: parseImport(text)}; render(); },
  impadd: () => {
    const t = importDraft.topic, ts = Date.now().toString(36);
    importDraft.parsed.out.forEach((o, k) => S.custom.push({id: `you-${ts}-${k}`, topic: t, d: 2, ...o, src: "you"}));
    const n = importDraft.parsed.out.length; importDraft = null; rebuild(); save(true); render(); toast(`Added ${n} questions to ${TOP[t].name}.`);
  },
  gen: () => generate(),
  photostop: () => photo?.ctl?.abort(),
  photodrop: d => { photo.items.splice(+d.k, 1); render(); },
  photoclear: () => { photo = null; render(); },
  photoadd: () => {
    const ts = Date.now().toString(36), n = photo.items.length;
    photo.items.forEach((it, k) => S.custom.push({id: `you-${ts}-${k}`, topic: it.topic, d: 2, q: it.q, o: it.o, a: it.a, x: it.x, keySrc: it.keySrc, src: "you"}));
    photo = {msg: `Added ${n} questions. They now appear in smart sessions, unit practice and review.`}; rebuild(); save(true); render(); toast(`Added ${n} questions.`);
  },
  genstop: () => aiState.gen?.ctl?.abort(),
  joingroup: async () => { S.group = true; lastLeague = ""; save(); dirty = true; await flush(); groupState = null; loadGroup(true); render(); toast("You're on this week's board."); },
  leavegroup: async () => { S.group = false; save(); groupState = null; try { await db.doc(`league/${uid}`).delete(); } catch (e) {} render(); toast("You left the board. Your entry is removed."); },
  eyenow: () => startEye(),
  eyedone: () => { eyeSheet = null; activeSec = 0; clearInterval(eyeTimer); renderOverlay(); },
  reset1: () => { confirmReset = true; render(); },
  reset0: () => { confirmReset = false; render(); },
  reset2: () => { const k = {examDate: S.examDate, neg: S.neg, target: S.target, look: S.look}; S = Object.assign(blank(), k); confirmReset = false; pr = null; mk = null; localStorage.removeItem(MKEY); rebuild(); save(true); render(); toast("Progress erased."); }
};
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  if (a.tagName === "A") e.preventDefault();
  ACT[a.dataset.act]?.(a.dataset, a);
  if (xpQueue) showXP();
});
document.addEventListener("change", e => {
  if (e.target.id === "photoIn" && e.target.files?.length) { readPhotos([...e.target.files]); return; }
  const k = e.target.dataset?.set; if (!k) return;
  const v = e.target.value;
  if (k === "examDate") S.examDate = v; else if (k === "target") S.target = clamp(+v || 170, 150, 190); else if (k === "neg") S.neg = +v; else if (k === "look") { S.look = v; applyLook(); }
  save(); render();
});
document.addEventListener("input", e => { if (e.target.id === "cq") { flt.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#cq"); el.focus(); el.setSelectionRange(pos, pos); } });
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), n = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (e.key === "Escape" && (unitSheet || (mk && mk.sheet))) { ACT.closesheet(); return; }
  if (tab === "practice" && pr && !pr.end) {
    if (!pr.done && n >= 0) { pr.sel = n; render(); e.preventDefault(); }
    else if (!pr.done && k === "enter" && pr.sel != null) { answer(true); e.preventDefault(); }
    else if (!pr.done && k === "g" && pr.sel != null) { answer(false); e.preventDefault(); }
    else if (pr.done && (k === "n" || k === "enter")) { nextQ(); e.preventDefault(); }
  } else if (tab === "exams" && mk && !mk.result && !mk.pre) {
    if (n >= 0) { mk.ans[mk.i] = n; saveMock(); render(); }
    else if (k === "arrowright" && mk.i + 1 < mk.qs.length) ACT.mkgo({i: mk.i + 1});
    else if (k === "arrowleft" && mk.i > 0) ACT.mkgo({i: mk.i - 1});
  }
});
if (mk) tab = "exams";
render(true);
</script>
